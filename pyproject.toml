[project]
name = "ema-pytorch"
version = "0.8.2"
description = "Easy way to keep track of exponential moving average version of your pytorch module"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
    "artificial intelligence",
    "deep learning",
    "exponential moving average"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
]

dependencies = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/lucidrains/ema-pytorch"
Repository = "https://github.com/lucidrains/ema-pytorch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ema_pytorch"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
